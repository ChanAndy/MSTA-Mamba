seed: 42
dataset:
  name: pocus
  train_list: data/pocus/train.txt
  test_list: data/pocus/test.txt
  image_size: 224
  num_frames: 32
  num_classes: 2
model:
  backbone: nvidia/MambaVision-S-1K
  feature_dims: [96, 192, 384, 768]
train:
  epochs: 50
  batch_size: 4
  workers: 4
  lr: 0.0001
  weight_decay: 0.0005
  warmup_epochs: 5
  class_weights: [1.0, 5.0]
  output_dir: outputs/baseline_pocus
